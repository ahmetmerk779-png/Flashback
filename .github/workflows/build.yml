name: Build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.1
      - name: Build
        id: build
        continue-on-error: true
        run: gradle build --no-daemon --console=plain > build.log 2>&1
      - name: Save log to repo
        if: always()
        run: |
          mkdir -p ci-logs
          grep -n -E "error:|What went wrong|Could not|FAILED|BUILD|warning: \[" -A4 build.log | head -400 > ci-logs/errors.txt || true
          tail -n 120 build.log > ci-logs/tail.txt
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci-logs
          git commit -m "ci: build log" || true
          git push || true
      - name: Fail if build failed
        if: steps.build.outcome == 'failure'
        run: exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: Flashback-jar
          path: build/libs/flashback-1.0.0.jar
      - name: Release olustur
        if: steps.build.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" build/libs/flashback-1.0.0.jar \
            --title "Flashback build ${{ github.run_number }}" \
            --notes "Otomatik derleme. Jar dosyasini indirip mods klasorune at (Fabric API gerekir)." \
            --latest
